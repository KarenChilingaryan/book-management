name: Update Version

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  update-version:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set new version of app
      id: set_version
      env:
         CURRENT_VERSION: ${{ secrets.APP_VERSION }}
      run: |
         echo "Current version from secret: $CURRENT_VERSION"
         NEW_VERSION=$((CURRENT_VERSION + 1))
         echo "New version: $NEW_VERSION"
         echo "{\"version\": $NEW_VERSION}" > version.json
         echo "CURRENT_VERSION=$NEW_VERSION" >> $GITHUB_ENV

    - name: Commit and push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add version.json
        git commit -m "Increment version to ${{ env.CURRENT_VERSION }}"
        git push
      env:
        MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}

    - name: Update GitHub repo secret for future app builds
      uses: hmanzur/actions-set-secret@v2.0.0
      with:
        name: 'APP_VERSION'
        value: ${{ env.CURRENT_VERSION }}
        token: ${{ secrets.MY_GITHUB_TOKEN }}
