name: Update Version

on:
  push:
    branches: [ main ]

jobs:
  update-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Fetch all branches
      run: |
        git fetch --no-tags --prune --depth=1 origin +refs/heads/*:refs/remotes/origin/*

    - name: Set GitHub Actions user
      run: |
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config user.name "GitHub Actions"

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'
        cache: 'npm'
        cache-dependency-path: script/sync-ghes/package-lock.json

    - name: Install dependencies
      run: npm ci
      working-directory: ./script/sync-ghes

    - name: Increment version in JSON file
      id: increment_version
      run: |
        VERSION_FILE=version.json
        if [ ! -f "$VERSION_FILE" ]; then
          echo "$VERSION_FILE does not exist"
          exit 1
        fi

        echo "Current version file content:"
        cat $VERSION_FILE

        VERSION=$(jq .version $VERSION_FILE)

        if [ -z "$VERSION" ]; then
          echo "Failed to retrieve version from $VERSION_FILE"
          exit 1
        fi

        echo "Current version is $VERSION"
        
        NEW_VERSION=$((VERSION + 1))

        echo "New version is $NEW_VERSION"
        
        jq --arg new_version "$NEW_VERSION" '.version=($new_version | tonumber)' $VERSION_FILE > temp.json && mv temp.json $VERSION_FILE

        echo "Updated version file content:"
        cat $VERSION_FILE

    - name: Commit and push changes
      run: |
        git add version.json
        if [ -z "$(git status --porcelain)" ]; then
          echo "No changes to commit"
        else
          git commit -m "Increment version to ${{ steps.increment_version.outputs.new_version }}"
          git push
      env:
        MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
