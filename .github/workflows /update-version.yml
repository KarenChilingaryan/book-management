name: Update Version

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  update-version:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Increment version
      id: increment_version
      run: |
        CURRENT_VERSION=${{ secrets.APP_VERSION }}
        NEW_VERSION=$((CURRENT_VERSION + 1))
        echo "Current version: $CURRENT_VERSION"
        echo "New version: $NEW_VERSION"
        echo "::set-output name=new_version::$NEW_VERSION"

    - name: Update version.json
      run: |
        NEW_VERSION=${{ steps.increment_version.outputs.new_version }}
        jq --arg new_version "$NEW_VERSION" '.version=($new_version | tonumber)' version.json > temp.json && mv temp.json version.json
        echo "Updated version file content:"
        cat version.json

    - name: Commit and push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add version.json
        git commit -m "Increment version to ${{ steps.increment_version.outputs.new_version }}"
        git push
      env:
        MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}

    - name: Update GitHub Secret
      uses: hmanzur/actions-set-secret@v2.0.0
      with:
        name: 'APP_VERSION'
        value: ${{ steps.increment_version.outputs.new_version }}
        repository: ${{ github.repository }}
        token: ${{ secrets.MY_GITHUB_TOKEN }}
